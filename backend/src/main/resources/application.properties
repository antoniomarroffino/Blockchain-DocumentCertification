quarkus.datasource.db-kind=mysql

quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/blockchainDocuments
quarkus.datasource.username=root
quarkus.datasource.password=1234
quarkus.hibernate-orm.database.generation = drop-and-create

quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Accept,Authorization,Content-Type,X-Requested-With
quarkus.http.cors.exposed-headers=Content-Disposition

quarkus.http.body.uploads-directory=uploads
quarkus.http.body.delete-uploaded-files-on-end=true
quarkus.http.body.preallocate-body-buffer=true

quarkus.smallrye-openapi.path=/q/openapi
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.store-schema-directory=target/classes/META-INF/resources